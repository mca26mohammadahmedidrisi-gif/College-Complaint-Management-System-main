name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests and package
        working-directory: backend
        run: mvn --batch-mode verify

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check frontend JavaScript syntax
        run: find frontend/js -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build Vercel frontend
        working-directory: frontend
        env:
          CAMPUSCARE_API_BASE_URL: https://api.example.com
        run: npm run build
