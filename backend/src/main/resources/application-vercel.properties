# Vercel requires the container to open its HTTP port before the startup deadline.
# The production schema is applied manually with the Supabase upgrade scripts.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

# Do not block container startup waiting for the remote Supabase connection.
# Hikari opens a connection in the background; readiness and API calls still use the DB.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.minimum-idle=1
