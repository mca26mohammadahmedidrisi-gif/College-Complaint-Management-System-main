spring.application.name=college-complaint-management
server.port=${PORT:8080}

# Supabase PostgreSQL connection. Supply credentials through environment variables.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Apply src/main/resources/db/schema.sql manually before running the application.
# Hibernate validates mapped tables and never creates or changes the schema.
spring.jpa.hibernate.ddl-auto=validate
# The database is always PostgreSQL; do not depend on a live JDBC metadata
# lookup just to choose Hibernate's dialect during startup.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Supabase Storage credentials are server-side only. Keep the bucket private.
supabase.storage.url=${SUPABASE_URL:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:complaint-images}
supabase.storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.signed-url-ttl-seconds=${SUPABASE_SIGNED_URL_TTL_SECONDS:300}

# Frontend origin is configurable for local development and deployment.
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

# Base64-encoded secret of at least 32 bytes. Required by JWT signing and validation.
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=${JWT_ISSUER:college-complaint-management}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Separate key used only to sign opaque complaint tracking references.
app.complaint-tracking.secret-base64=${COMPLAINT_TRACKING_SECRET_BASE64}

# Optional, one-time first-admin provisioning. Keep disabled after setup.
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Set APP_EMAIL_ENABLED=true and configure SMTP values on the backend Vercel project.
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.frontend-url=${FRONTEND_URL:https://campuscare-frontend-seven.vercel.app}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# SMTP delivery is optional; its status must not take the API health endpoint down.
management.health.mail.enabled=false
